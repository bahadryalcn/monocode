<style>
#project-icon-preview { font: 12px 'Segoe UI', sans-serif; padding: 16px 0; color: #dedee3; }
#project-icon-preview .pi-grid { display: grid; grid-template-columns: repeat(8,minmax(0,1fr)); gap: 6px; }
#project-icon-preview .pi-controls { display:flex; gap:8px; margin-bottom:12px; }
#project-icon-preview input { flex:1; min-width:0; }
#project-icon-preview input, #project-icon-preview select { font:inherit; padding:8px; border:1px solid #34373e; background:#1b1d21; color:#ddd; border-radius:6px; }
#project-icon-preview .pi-item { display:flex; flex-direction:column; align-items:center; gap:12px; padding:18px 6px 12px; color:#dedee3; background:#1b1d21; border:1px solid #34373e; border-radius:10px; font:inherit; }
#project-icon-preview .pi-item[aria-pressed=true] { border-color:#83b7fb; background:#202b3a; }
#project-icon-preview .pi-item > svg { width:42px; height:42px; }
#project-icon-preview .pi-item[hidden] { display:none; }
#project-icon-preview .pi-item > span { max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
#project-icon-preview .pi-mini { display:flex; align-items:center; gap:14px; color:#8e9199; }
#project-icon-preview .pi-mini svg:first-child { width:12px; height:12px; }
#project-icon-preview .pi-mini svg:last-child { width:24px; height:24px; }
#project-icon-preview .pi-choice { padding-top:14px; color:#a9adb5; }
@media(max-width:560px) { #project-icon-preview .pi-grid {grid-template-columns:repeat(4,minmax(0,1fr));} }
</style>
<script>
(() => {
  const root = document.getElementById('project-icon-preview');
  root.querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
    root.querySelectorAll('button').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
    root.querySelector('.pi-choice').textContent = button.dataset.label;
  }));
  const normalize = value => value.toLocaleLowerCase('tr').replace(/ı/g, 'i').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const filter = () => {
    const terms = normalize(root.querySelector('input').value).trim().split(/\s+/).filter(Boolean);
    const category = root.querySelector('select').value;
    root.querySelectorAll('button').forEach(button => {
      button.hidden = !(category === 'All' || button.dataset.category === category) || !terms.every(term => normalize(button.dataset.search).includes(term));
    });
  };
  root.querySelector('input').addEventListener('input', filter);
  root.querySelector('select').addEventListener('change', filter);
})();
</script>
