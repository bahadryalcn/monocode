name: Fork release (macOS)

# Builds the fork's macOS app for an existing release and attaches the DMGs.
# Run by hand; the upstream Release workflow needs signing secrets this fork
# does not have. The apps are ad-hoc signed, not notarized.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach to, e.g. v0.7.0
        required: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      # Builds the branch the run was started from, so a release tagged before
      # this workflow existed can still get its macOS build.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: npm ci

      - name: Build macOS apps
        run: |
          set -euo pipefail
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.fork.macos.conf.json
          npx tauri build --target x86_64-apple-darwin --bundles app,dmg --config src-tauri/tauri.fork.macos.conf.json

      - name: Attach DMGs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(target/*-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 2 ]; then
            echo "expected 2 DMGs, found ${#dmgs[@]}"
            exit 1
          fi
          gh release upload "$TAG" "${dmgs[@]}" --clobber --repo "$GITHUB_REPOSITORY"
